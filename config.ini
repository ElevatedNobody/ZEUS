[DEFAULT]
app_name = ZEUS
app_tagline = Autonomous AI Command & Intelligence System
version = 3.0.0
debug = false
log_level = INFO

[paths]
base_dir = .
config_dir = config
data_dir = database
log_dir = logs
models_dir = models

[ollama]
# The model runtime must be on THIS machine. A non-loopback host is refused
# unless allow_remote = true (only for a deliberately paired LAN model server).
host = http://127.0.0.1:11434
allow_remote = false
timeout = 120
generation_timeout = 240

[models]
# Leave the *_model keys empty to let ZEUS choose from what STEP 1 : INSTALL
# installed for this hardware (core/hardware.py). Set one to force a model,
# e.g.  reasoning_model = deepseek-r1:8b
# Context window sent to Ollama. 8192 fits an 8B model in 8 GB of VRAM.
num_ctx = 8192
# Model lifecycle (core/model_lifecycle.py). On Windows+CUDA every loaded
# Ollama model also commits about its own size in host memory; on a 16 GB
# machine two large models plus Whisper exhaust it (the 2026-09-24 failures).
# How long a model stays loaded after its last use:
keep_alive = 5m
# Models allowed loaded at once (0 = no limit). Enforced by ZEUS, whoever
# started Ollama:
max_resident = 1

[memory]
# Long-term memory recalled into conversations (memory/hermes_store.py).
#   hermes - the vendored cognis-hermes engine (third_party/hermes). NOTE its
#            licence is NON-COMMERCIAL (COCL v1.0) - see
#            third_party/hermes/AGNI_VENDOR.md before any commercial use.
#   native - ZEUS's own store (SQLite FTS5/BM25), no third-party code.
backend = hermes
# Relevance (0..1) a memory needs to be injected into a prompt:
min_score = 0.12
# At most this many memories, and this many characters, per request:
max_results = 6
context_chars = 1600
# If the memory store cannot be read: answer (without memory, logged) | refuse
on_unavailable = answer

[auth]
require_login = true
max_failed_attempts = 5
lockout_seconds = 60
min_password_length = 8
session_idle_minutes = 15
allow_multiple_users = true

[security]
# HIGH_RISK and above always need a human approval.
confirm_threshold = HIGH_RISK
# Application network policy for ZEUS's own process:
#   monitor   - allow, record external destinations
#   sovereign - loopback + LAN only (default)
#   lockdown  - loopback only (kill switch)
network_mode = sovereign
# Include Ollama (ollama.exe, "ollama app.exe") in the OS firewall rules.
# Ollama contacts ollama.com on its own (model recommendations, cloud model
# cache); with this on, `ollama pull` needs FIREWALL_AGNI.bat remove first.
firewall_include_ollama = true
# Extra LAN ranges treated as local (comma-separated CIDR). Empty = the
# private ranges 10/8, 172.16/12, 192.168/16 and link-local.
lan_ranges =
# Refuse to route to a model whose digest is not in config/trusted_models.json
# (created by STEP 1 : INSTALL). Set false only while testing new models.
require_trusted_models = true

[voice]
enabled = true
preload = true
# Empty = the best provider that actually loads on this machine
# (chatterbox > piper > system). SETUP_VOICE.bat writes the verified choice here.
tts_provider =
stt_provider =
# process (default): Whisper runs in a supervised worker process, so a native
# crash in CTranslate2/CUDA cannot close ZEUS. inprocess: the old behaviour.
stt_isolation = process
stt_device = auto
stt_compute_type = auto
stt_model_size = auto
# Low-memory recogniser, used ONLY when the primary model (models/whisper,
# large-v3-turbo) cannot get memory. auto = any complete models/whisper-* folder,
# a size (small, base, ...) = models/whisper-<size> only, none = no fallback.
# It runs on the GPU at int8_float16 when there is one (2.2 GB peak, measured),
# else on the CPU (3.2 GB). Installed once, verified by SHA-256, reused offline:
#   python scripts/setup_models.py --whisper-fallback small
stt_fallback_model = small
# Microphone: wait this long for you to START speaking, then stop recording
# ~0.7 s after you stop (listen_until_silence), up to listen_max_seconds.
listen_seconds = 4.0
listen_until_silence = true
listen_max_seconds = 15
tts_device =
tts_volume = 1.0
tts_voice_prompt =
tts_exaggeration =
tts_cfg_weight =
tts_temperature =
max_spoken_chars = 600
voice_profile = medha
voice_device = auto
# Keep the Chatterbox voice loaded while you talk instead of loading it for
# every sentence. auto = on a GPU (where loading was most of each sentence's
# delay); on the CPU it would hold ~7 GB, so auto leaves it off there.
tts_keep_loaded = auto
# Release the loaded voice after this many seconds without speaking.
tts_idle_seconds = 300
voice_streaming = true
voice_interruptible = true
voice_fallback = true
voice_language = en
voice_speed = 0.95
voice_auto_play = true
voice_polish = true
voice_style = true

[performance]
low_resource = false

[nodes]
# Local ZEUS multi-node network. Off by default; nothing listens unless enabled.
enabled = false
port = 47291
node_name =

[face]
# Face login with InsightFace (third_party/insightface). Models come from
# STEP 1 : INSTALL. How a face may be used to sign in is chosen by 'login' below.
enabled = true
# off              passwords only
# second_factor    accounts that enrolled a face must ALSO pass a face check
#                  after the password
# face_or_password the sign-in screen offers PASSWORD or FACE: either one alone
#                  signs in (live face required, stricter match, 3 face tries
#                  then the password). Enrol from Security > Face login.
login = off
# auto = the most accurate pack present (buffalo_l, then smaller ones)
model_pack = auto
# cosine similarity a face must reach to match its template
threshold = 0.45
# face-only sign-in (face_or_password) is held higher: this similarity, and
# ahead of every other enrolled account by login_margin
login_threshold = 0.50
login_margin = 0.08
# required | observe | off  - required rejects faces that fail RGB liveness
liveness = required
liveness_threshold = 0.80
camera_index = 0

[knowledge]
# ZEUS company knowledge base (knowledge_fabric/, database/knowledge_fabric.db).
# Classification given to a document that does not state one:
# public | internal | confidential | restricted
default_classification = internal
# "FY2019" means the fiscal year ENDING in 2019 (end) or STARTING in 2019 (start)
fiscal_year_label = end
# compute vector embeddings while ingesting: auto (when the local embedding
# model answers) | off (add them later with RAG_REINDEX.bat)
embed_on_ingest = auto
# DEVELOPMENT ONLY. true = every question writes logs\rag_trace\<id>.json with the
# retrieved passages, the exact model request and response and the sources. The
# file contains document text, so keep this false in production; RAG_TRACE.bat
# writes a trace for its own run without turning this on.
rag_debug = false

[crudex]
mode = offline
server_url = 
ca_file = 
sync_interval_seconds = 0
